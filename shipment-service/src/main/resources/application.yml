spring:
  application:
    name: shipment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shipments}
    username: ${DB_USER:shipment_user}
    password: ${DB_PASSWORD:shipment_pass}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is managed by Flyway, Hibernate only validates it
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWRldi1rZXktZm9yLWNvdXJpZXItdHJhY2tpbmc=}
    expiration-minutes: 60
