spring:
  application:
    name: shipment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shipments}
    username: ${DB_USER:delivery}
    password: ${DB_PASSWORD:delivery}
  jpa:
    hibernate:
      ddl-auto: validate   # šemu pravi Flyway, Hibernate je samo provjerava
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8081
